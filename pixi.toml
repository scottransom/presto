# Pixi workspace for building and developing PRESTO.
#
# Quickstart:
#     pixi run build        # full build: C code + libpresto + Python package
#     pixi run test         # quick smoke tests
#     pixi shell            # drop into the environment (prepfold, python, etc.)
#
# The C code installs into the pixi environment prefix (.pixi/envs/default),
# and the Python package is installed there with uv.  Use
# `pixi run install-py-editable` instead of the normal build if you want live
# editing of the pure-Python modules while debugging.
#
# Notes:
#  - ERFA comes from conda-forge's liberfa (the meson subproject fallback in
#    subprojects/erfa.wrap is only for builds without a system ERFA).
#  - tempo2 (used for polyco generation, e.g. prepfold -timing) comes from
#    conda-forge, which also sets $TEMPO2.  TEMPO is no longer needed at all.

[workspace]
name = "presto"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.10"
c-compiler = "*"
meson = ">=1.3"
ninja = "*"
pkg-config = "*"
uv = "*"
numpy = "*"
scipy = "*"
astropy = "*"
matplotlib = "*"
pytest = "*"
hypothesis = "*"
ruff = "*"
fftw = "*"
gsl = "*"
liberfa = "*"
cfitsio = "*"
glib = "*"
libpng = "*"
xorg-libx11 = "*"
pgplot = "*"
# Ghostscript ('gs'): prepfold calls it to turn its .ps plots into nice
# anti-aliased .png images (optional at runtime; the .ps is made regardless)
ghostscript = "*"
# tempo2: polyco generation (e.g. prepfold -timing)
tempo2 = "*"

[activation.env]
PRESTO = "$PIXI_PROJECT_ROOT"
PGPLOT_DIR = "$CONDA_PREFIX/share/pgplot"
# So the Python-package build can link against the installed libpresto
LIBRARY_PATH = "$CONDA_PREFIX/lib"

# The pixi tasks use their own build directory (build-pixi) so they never
# interfere with a manually managed meson `build` directory.
[tasks]
configure = { cmd = """
test -f build-pixi/meson-private/coredata.dat \
  && meson setup --reconfigure build-pixi --prefix=$CONDA_PREFIX --libdir=lib \
  || meson setup build-pixi --prefix=$CONDA_PREFIX --libdir=lib
""" }
build-c = { cmd = "meson compile -C build-pixi", depends-on = ["configure"] }
install-c = { cmd = "meson install -C build-pixi", depends-on = ["build-c"] }
install-py = { cmd = "uv pip install --python=$CONDA_PREFIX/bin/python ./python", depends-on = [
    "install-c",
] }
install-py-editable = { cmd = "uv pip install --python=$CONDA_PREFIX/bin/python -e ./python", depends-on = [
    "install-c",
] }
build = { depends-on = ["install-py"] }
# The known-good tests.  Listed explicitly: many older scripts in tests/ are
# demos or stale smoke tests rather than tests (see ROADMAP.md).
test = { cmd = """
pytest tests/test_barycenter.py tests/test_binary_calcs.py \
  tests/test_maximize_rz.py tests/test_pipeline_synthetic.py tests/test_sifting.py \
  tests/test_coherentsearch.py \
  python/fftfit_src \
  && python tests/test_presto_python.py
""", depends-on = [
    "build",
] }
# Real-data tests on the 173 MB Terzan 5 PSRFITS file, which is not in the repo
# (tests/prepfold/get_test_data.sh fetches it from the repo's test-data-v1
# GitHub release): the full search pipeline (tests/test_realdata_search.py),
# then the prepfold/prepfold_multi regression suites in tests/prepfold/.
# ~7 min; CI runs it weekly (.github/workflows/realdata.yml), not on every push.
get-test-data = "sh tests/prepfold/get_test_data.sh"
# Its pytest temp dir is build-pixi/pytest-realdata, which CI uploads on failure.
test-realdata-search = { cmd = """
pytest --basetemp=build-pixi/pytest-realdata tests/test_realdata_search.py
""", depends-on = [
    "build",
    "get-test-data",
] }
test-realdata-prepfold = { cmd = """
meson compile -C build-pixi reader_equiv_check \
  && cd tests/prepfold && sh prepfold_tests.sh && sh prepfold_multi_tests.sh
""", depends-on = [
    "build",
    "get-test-data",
] }
test-realdata = { depends-on = ["test-realdata-search", "test-realdata-prepfold"] }
