# Build PRESTO (C code + libpresto + Python package) in the pixi environment and run the
# known-good test suite (`pixi run test`; the list lives in pixi.toml) on the platforms
# conda-forge ships.  osx-64 is in pixi.toml but left out here to keep the matrix small;
# the feedstock still builds and tests it at release time.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: osx-arm64, os: macos-15 }
          # Plain char is unsigned on aarch64 but signed on x86.  Building with
          # -funsigned-char catches code that silently assumes signed char.
          - { name: linux-64-unsigned-char, os: ubuntu-24.04, unsigned_char: true }
          # AddressSanitizer + UndefinedBehaviorSanitizer: out-of-bounds and uninitialized
          # reads that happen to give the right answer on one platform (like the mask.c
          # bug that only misbehaved on macOS) fail here on every push.
          - { name: linux-64-sanitizers, os: ubuntu-24.04, sanitize: true }
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          locked: true
      - name: Configure with -funsigned-char
        if: matrix.unsigned_char
        # c_args replaces meson's use of CFLAGS, so keep conda's flags as well.
        # The `configure` task's --reconfigure preserves c_args.
        run: >-
          pixi run bash -c 'meson setup build-pixi --prefix=$CONDA_PREFIX --libdir=lib
          -Dc_args="$CFLAGS -funsigned-char"'
      - name: Configure with ASan + UBSan
        if: matrix.sanitize
        # UBSan findings abort (-fno-sanitize-recover) so that they fail the tests.
        run: >-
          pixi run bash -c 'meson setup build-pixi --prefix=$CONDA_PREFIX --libdir=lib
          -Db_sanitize=address,undefined -Db_lundef=false
          -Dc_args="$CFLAGS -fno-omit-frame-pointer -fno-sanitize-recover=undefined"'
      - name: Build and test
        if: ${{ !matrix.sanitize }}
        run: pixi run test
      - name: Build and test (sanitized)
        if: matrix.sanitize
        # Python itself is not instrumented, so preload ASan's runtime for the SWIG module
        # (harmless for the instrumented executables).  Leak checking is off: many tools
        # never free what they allocate before exiting.
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: >-
          pixi run build && pixi run bash -c
          'LD_PRELOAD=$($CC -print-file-name=libasan.so) pixi run test'
      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.name }}
          path: build-pixi/meson-logs/
          if-no-files-found: ignore
